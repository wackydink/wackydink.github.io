<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <title>ARRAY//404 Builds Archive - WackyDink</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --red: #F50201;
            --dark-red: #C00302;
            --green: #03DE03;
            --dark-green: #035202;
            --blue: #023EF3;
            --dark-blue: #031DB7;
            --yellow: #FACD06;
            --orange: #E18404;
            --white: #E9EAE9;
            --gh-bg: #24292e;
        }

        ::selection { background: var(--green); color: var(--black); }
        ::-moz-selection { background: var(--green); color: var(--black); }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        a, body, button, input {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><path fill="%2303DE03" d="M4 0h2v3H4zM4 7h2v3H4zM0 4h3v2H0zM7 4h3v2H7zM4 4h2v2H4z"/></svg>') 5 5, crosshair;
        }

        body {
            background-color: var(--black);
            color: var(--white);
            font-family: 'VT323', monospace;
            font-size: 1.35rem;
            line-height: 1.4;
            background-image: linear-gradient(to right, rgba(3, 82, 2, .12) 1px, transparent 1px), linear-gradient(to bottom, rgba(3, 82, 2, .12) 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Pixel Containers */
        .pixel-box {
            background: var(--black);
            border: 4px solid var(--green);
            box-shadow: 6px 6px 0 var(--dark-green);
            padding: 1.5rem;
            margin-bottom: 2rem;
            position: relative;
        }

        .pixel-box.blue-accent { border-color: var(--blue); box-shadow: 6px 6px 0 var(--dark-blue); }
        .pixel-box.red-accent { border-color: var(--red); box-shadow: 6px 6px 0 var(--dark-red); }
        .pixel-box.yellow-accent { border-color: var(--yellow); box-shadow: 6px 6px 0 var(--orange); }

        h1, h2, h3, h4 {
            font-family: 'Press Start 2P', cursive;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(1.1rem, 2.5vw, 1.6rem);
            color: var(--yellow);
            text-shadow: 2px 2px var(--orange);
            margin-bottom: .5rem;
        }

        .subtitle { color: var(--green); font-size: 1.2rem; }

        .section-title {
            font-size: 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .section-title::before { content: ">"; color: var(--red); }

        /* Controls Area */
        .dir-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.2rem;
            border-bottom: 2px dashed rgba(3, 222, 3, 0.3);
            padding-bottom: 1rem;
        }

        .dir-path {
            color: var(--green);
            font-size: 1.3rem;
            word-break: break-all;
        }

        .search-sort-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .pixel-input {
            background: var(--black);
            border: 2px solid var(--blue);
            color: var(--white);
            font-family: 'VT323', monospace;
            font-size: 1.15rem;
            padding: 4px 8px;
            outline: none;
            width: 160px;
        }

        .pixel-input:focus { border-color: var(--yellow); }

        .pixel-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: .6rem;
            padding: .6rem .8rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            transition: transform .1s, box-shadow .1s;
            border: 2px solid var(--black);
            background: var(--yellow);
            color: var(--black);
            box-shadow: 4px 4px 0 var(--orange);
            user-select: none;
        }

        .pixel-btn:hover { transform: translate(-2px, -2px); }
        .pixel-btn:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0 var(--orange); }

        .pixel-btn.download {
            background: var(--green);
            color: var(--black);
            box-shadow: 4px 4px 0 var(--dark-green);
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.8rem;
            font-size: .7rem;
        }

        /* File List & Cards */
        .file-list { list-style: none; display: flex; flex-direction: column; gap: 1rem; }

        .file-card {
            background: rgba(0, 0, 0, 0.8);
            border: 2px dashed var(--blue);
            transition: background .2s, border-color .2s;
        }

        .file-card:hover, .file-card.active {
            border-color: var(--yellow);
            background: rgba(2, 62, 243, .12);
        }

        .file-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            padding: 0.85rem 1rem;
            user-select: none;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.25rem;
            flex-wrap: wrap;
            min-width: 0;
        }

        .file-icon { color: var(--red); flex-shrink: 0; }
        .file-name { color: var(--white); word-break: break-all; }

        .file-meta-right {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            margin-left: auto;
        }

        .file-size { color: var(--yellow); font-size: 1.15rem; white-space: nowrap; }
        .file-date { color: #888; font-size: 1.1rem; white-space: nowrap; }

        .arrow-icon {
            color: var(--yellow);
            font-size: 0.8rem;
            transition: transform 0.3s ease;
        }

        .file-card.active .arrow-icon { transform: rotate(90deg); }

        /* Tag Badges */
        .tag-group { display: flex; align-items: center; gap: 6px; }

        .tag {
            font-family: 'Press Start 2P', cursive;
            font-size: .5rem;
            padding: 3px 6px;
            color: var(--black);
            background: var(--white);
            border: 1px solid var(--black);
        }

        .tag.latest { background: var(--green); color: var(--black); }
        .tag.stable { background: var(--blue); color: var(--white); }
        .tag.beta { background: var(--yellow); color: var(--black); }
        .tag.alpha { background: var(--red); color: var(--white); }
        .tag.proto { background: var(--orange); color: var(--black); }

        /* Desktop vs Mobile Tag Positioning */
        @media (min-width: 600px) {
            .tag-group.mobile-tags { display: none; }
            .tag-group.desktop-tags { display: flex; }
        }

        @media (max-width: 599px) {
            .tag-group.mobile-tags { display: flex; }
            .tag-group.desktop-tags { display: none; }
        }

        /* Drawer Details */
        .file-details-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-out;
            background: rgba(0, 0, 0, 0.95);
        }

        .file-card.active .file-details-wrapper {
            grid-template-rows: 1fr;
            border-top: 1px dashed var(--blue);
        }

        .file-details-inner { overflow: hidden; }

        .file-details-content {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .changelog-box {
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.85rem 1rem;
            background: rgba(255, 255, 255, .02);
        }

        .changelog-box h4 {
            color: var(--red);
            font-size: .7rem;
            margin-bottom: 0.5rem;
        }

        .changelog-box ul {
            list-style-type: square;
            padding-left: 1.25rem;
            color: var(--white);
            font-size: 1.15rem;
        }

        .changelog-box li { margin-bottom: 0.3rem; }

        /* Checksum Box */
        .sha-container { display: flex; flex-direction: column; gap: 4px; }
        .sha-label { color: var(--green); font-size: 1.1rem; }

        .sha-box {
            display: flex;
            align-items: center;
            background: #111;
            border: 1px solid var(--dark-green);
            padding: 6px 10px;
            gap: 8px;
            user-select: none;
            transition: border-color 0.2s;
        }

        .sha-box:hover { border-color: var(--yellow); }
        .sha-hash { font-size: 1.05rem; color: #aaa; word-break: break-all; flex-grow: 1; }

        .sha-copy-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: .5rem;
            background: var(--gh-bg);
            color: var(--white);
            padding: 4px 8px;
            border: 1px solid var(--white);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Toast Popup */
        .toast-popup {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--black);
            color: var(--green);
            border: 3px solid var(--green);
            box-shadow: 4px 4px 0 var(--dark-green);
            padding: 10px 18px;
            font-family: 'Press Start 2P', cursive;
            font-size: .65rem;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s, transform 0.25s, visibility 0.25s;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast-popup.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .copyright {
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            font-size: .6rem;
            color: var(--white);
            opacity: .75;
            margin-top: 1rem;
            padding-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="pixel-box">
            <h1>ARRAY//404 Builds Archive</h1>
            <p class="subtitle">Official Builds Archive of ARRAY//404</p>
        </header>

        <!-- Main Directory Area -->
        <main class="pixel-box blue-accent">
            <h2 class="section-title" style="color:var(--blue)">Directory Index</h2>
            
            <div class="dir-controls">
                <span class="dir-path">Index of /array404/builds/</span>
                
                <div class="search-sort-group">
                    <input type="text" id="searchInput" class="pixel-input" placeholder="Search build..." oninput="renderList()">
                    <button class="pixel-btn" id="sortBtn" onclick="toggleSort()">LATEST ▼</button>
                </div>
            </div>

            <ul class="file-list" id="fileList"></ul>
        </main>

        <!-- Footer -->
        <footer class="copyright" id="copyright"></footer>
    </div>

    <!-- Toast Notification -->
    <div id="toastPopup" class="toast-popup">CHECKSUM COPIED!</div>

    <script>
        const buildData = [
            {
                id: 'v0.0.5', version: 'v0.0.5', filename: 'prtp0.0.5', size: '23.77', date: '11-09-2026',
                labels: [{ name: 'LATEST', class: 'latest' }, { name: 'PROTOTYPE', class: 'prototype' }],
                sha256: '8CD96BF74901BDB4498E6BE365AA424A881CF91694A74AD2DE4ECAE4CF61E503',
                changelog: ['Added Game Save/Load System', 'Added World Creation and Deletion System', 'Updated Sky Shader', 'Updated Loading Screen', 'Remade Interaction Highlighter'],
                downloadUrl: '#download-v2.0.0'
            },
            {
                id: 'v150', version: 'v1.5.0', filename: 'Artaneg_v1.5.0.zip', size: '840.5 MiB', date: '2026-05-10',
                labels: [{ name: 'BETA', class: 'beta' }],
                sha256: 'a591a6d40bf420404a011733cfb7b190d62c65bf0bcda32b57b277d9ad9f146e',
                changelog: ['Introduced new enemy variants (Ranged/Flying).', 'Added level 3 and expanded lore notes.', 'Audio engine update with sound effect variations.'],
                downloadUrl: '#download-v1.5.0'
            },
            {
                id: 'v100', version: 'v1.0.0', filename: 'Artaneg_v1.0.0.zip', size: '512.0 MiB', date: '2026-01-20',
                labels: [{ name: 'ALPHA', class: 'alpha' }],
                sha256: '7f83b1657ff1fc53b92dc18148a1d65dfc2d4b1fa3d677284addd200126d9069',
                changelog: ['Official initial release build.', 'Complete 2-level campaign.'],
                downloadUrl: '#download-v1.0.0'
            },
            {
                id: 'v030', version: 'v0.3.0', filename: 'Artaneg_v0.3.0_proto.zip', size: '128.4 MiB', date: '2025-11-04',
                labels: [{ name: 'PROTOTYPE', class: 'proto' }],
                sha256: '8f41c23871ff2bc53b92dc18148a1d65dfc2d4b1fa3d677284addd200126d4001',
                changelog: ['Implemented player movement and basic combat loop.', 'Placeholder art assets test release.'],
                downloadUrl: '#download-v0.3.0'
            }
        ];

        let currentSort = 'latest', toastTimer;

        function renderList() {
            const list = document.getElementById('fileList');
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = buildData.filter(b => 
                b.filename.toLowerCase().includes(query) || 
                b.version.toLowerCase().includes(query) ||
                b.labels.some(l => l.name.toLowerCase().includes(query))
            );

            filtered.sort((a, b) => currentSort === 'latest' ? new Date(b.date) - new Date(a.date) : new Date(a.date) - new Date(b.date));

            if (filtered.length === 0) {
                list.innerHTML = `<li style="text-align:center; padding: 2rem; color: var(--red);">NO BUILDS FOUND MATCHING SEARCH</li>`;
                return;
            }

            list.innerHTML = filtered.map(b => {
                const tags = b.labels.map(l => `<span class="tag ${l.class}">${l.name}</span>`).join('');
                const changelog = b.changelog.map(c => `<li>${c}</li>`).join('');
                
                return `
                    <li class="file-card" id="card-${b.id}">
                        <div class="file-header" onclick="toggleCard('card-${b.id}')">
                            <div class="file-info">
                                <span class="file-icon">[ZIP]</span>
                                <span class="file-name">${b.filename}</span>
                                <div class="tag-group mobile-tags">${tags}</div>
                            </div>
                            <div class="file-meta-right">
                                <div class="tag-group desktop-tags">${tags}</div>
                                <span class="file-size">${b.size}</span>
                                <span class="file-date">${b.date}</span>
                                <span class="arrow-icon">▶</span>
                            </div>
                        </div>
                        <div class="file-details-wrapper">
                            <div class="file-details-inner">
                                <div class="file-details-content">
                                    <div class="changelog-box">
                                        <h4>&gt; CHANGELOG:</h4>
                                        <ul>${changelog}</ul>
                                    </div>
                                    <div class="sha-container">
                                        <span class="sha-label">&gt; SHA256 CHECKSUM:</span>
                                        <div class="sha-box" onclick="copySHA(this, '${b.sha256}')">
                                            <span class="sha-hash">${b.sha256}</span>
                                            <span class="sha-copy-btn">COPY</span>
                                        </div>
                                    </div>
                                    <a href="${b.downloadUrl}" class="pixel-btn download">DOWNLOAD BUILD (${b.size})</a>
                                </div>
                            </div>
                        </div>
                    </li>`;
            }).join('');
        }

        function toggleCard(cardId) {
            const card = document.getElementById(cardId);
            const isActive = card.classList.contains('active');
            document.querySelectorAll('.file-card').forEach(c => c.classList.remove('active'));
            if (!isActive) card.classList.add('active');
        }

        function toggleSort() {
            currentSort = currentSort === 'latest' ? 'oldest' : 'latest';
            document.getElementById('sortBtn').innerText = currentSort === 'latest' ? 'LATEST ▼' : 'OLDEST ▲';
            renderList();
        }

        function triggerToast() {
            const popup = document.getElementById('toastPopup');
            popup.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => popup.classList.remove('show'), 1800);
        }

        function copySHA(container, text) {
            const btn = container.querySelector('.sha-copy-btn');
            const showSuccess = () => {
                btn.innerText = 'COPIED!';
                btn.style.background = 'var(--green)';
                btn.style.color = 'var(--black)';
                triggerToast();
                setTimeout(() => {
                    btn.innerText = 'COPY';
                    btn.style.background = 'var(--gh-bg)';
                    btn.style.color = 'var(--white)';
                }, 1800);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(showSuccess).catch(() => fallbackCopy(text, showSuccess));
            } else {
                fallbackCopy(text, showSuccess);
            }
        }

        function fallbackCopy(text, callback) {
            const el = document.createElement("textarea");
            el.value = text;
            el.style.cssText = "position:fixed;left:-9999px";
            document.body.appendChild(el);
            el.select();
            try { document.execCommand('copy'); callback(); } catch (e) {}
            document.body.removeChild(el);
        }

        // Initialize Dynamic Copyright Year & Initial List Render
        document.addEventListener("DOMContentLoaded", function() {
            const startYear = 2026;
            const currentYear = new Date().getFullYear();
            const yearText = startYear < currentYear ? `${startYear}-${currentYear}` : startYear;
            const copyrightElem = document.getElementById("copyright");
            if (copyrightElem) {
                copyrightElem.innerHTML = `&copy; ${yearText} WackyDink. All rights reserved.`;
            }
            renderList();
        });
    </script>
</body>
</html>
